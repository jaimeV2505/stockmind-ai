# Phase 0: only the local database exists. api / web / workers will be added when they are implemented.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: stockmind
      POSTGRES_PASSWORD: stockmind   # local development only
      POSTGRES_DB: stockmind
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockmind"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
