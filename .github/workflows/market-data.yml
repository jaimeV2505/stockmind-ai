name: Market data refresh
# Fetches END-OF-DAY bars from Alpaca, runs the stockmind engines and commits apps/web/data/market-snapshot.json (Vercel then redeploys).
# Needs repository secrets ALPACA_API_KEY and ALPACA_API_SECRET. The repo MUST be private: the workflow refuses to publish provider data otherwise.
on:
  schedule:
    - cron: "30 22 * * 1-5"      # 22:30 UTC Mon-Fri: after the US close in both EST (21:00 UTC) and EDT (20:00 UTC)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: market-data, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse to run in a public repository
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)"
          if [ "$private" != "true" ]; then
            echo "::error::This repository is public. Provider market data must not be published; make the repo private first."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install "numpy>=1.26" "pandas>=2.2" "tzdata>=2024.1"
      - name: Export market snapshot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: python scripts/export_demo_snapshot.py --source market --feed iex
      - name: Commit if changed
        run: |
          git config user.name  "stockmind-data-bot"
          git config user.email "stockmind-data-bot@users.noreply.github.com"
          git add apps/web/data/market-snapshot.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "data: refresh market snapshot $(date -u +%F)" && git push; fi
