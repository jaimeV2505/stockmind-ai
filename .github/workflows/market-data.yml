name: Market data refresh and deploy
# Fetches END-OF-DAY bars from Alpaca, runs the stockmind engines, builds the web app WITH the data and deploys it to Vercel.
# Alpaca does not allow redistributing its data and this repository is PUBLIC, so the data must never enter git:
#   - apps/web/data/market-snapshot*.json is git-ignored (checked below and by tests/integration/test_repo_policy.py)
#   - no commit, no push and no upload-artifact step exists in this workflow
#   - the site is protected by HTTP Basic auth (apps/web/middleware.ts; STOCKMIND_DATA=market without a strong SITE_PASSWORD => 503)
# Required repository secrets: ALPACA_API_KEY, ALPACA_API_SECRET, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Required Vercel (Production) env vars: STOCKMIND_DATA=market, SITE_PASSWORD (>= 12 chars), optional SITE_USER.
on:
  schedule:
    - cron: "30 22 * * 1-5"      # 22:30 UTC Mon-Fri: after the US close in both EST (21:00 UTC) and EDT (20:00 UTC)
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: market-data, cancel-in-progress: false }
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
    steps:
      - name: Preflight - every required secret is present (names only, values are never printed)
        run: |
          missing=0
          for v in ALPACA_API_KEY ALPACA_API_SECRET VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then echo "::error::missing repository secret $v"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - name: Policy - provider data must never be tracked by git
        run: |
          git check-ignore -q apps/web/data/market-snapshot.json || { echo "::error::market-snapshot.json is not git-ignored"; exit 1; }
          if [ -n "$(git ls-files 'apps/web/data/market-snapshot*')" ]; then echo "::error::a market snapshot is tracked by git"; exit 1; fi
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install "numpy>=1.26" "pandas>=2.2" "tzdata>=2024.1"
      - name: Export market snapshot (fails loudly; never falls back to simulated data)
        run: python scripts/export_demo_snapshot.py --source market --feed iex
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm install --global vercel@latest        # TODO: pin an exact version once the first run is known to work
      - name: Pull Vercel project settings and environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Policy - the deployment must be password protected and in market mode
        run: |
          python - <<'PY'
          import sys
          env = {}
          for line in open(".vercel/.env.production.local"):
              line = line.strip()
              if line and not line.startswith("#") and "=" in line:
                  k, v = line.split("=", 1)
                  env[k] = v.strip().strip('"').strip("'")
          problems = []
          if env.get("STOCKMIND_DATA", "").lower() != "market":
              problems.append("Vercel Production env var STOCKMIND_DATA must be 'market'")
          if len(env.get("SITE_PASSWORD", "")) < 12:
              problems.append("Vercel Production env var SITE_PASSWORD must be set and at least 12 characters")
          for p in problems:
              print(f"::error::{p}")
          sys.exit(1 if problems else 0)
          PY
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Remove provider data from the runner
        if: always()
        run: rm -f apps/web/data/market-snapshot*.json
