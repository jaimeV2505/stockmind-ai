name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -v
  # TODO(Phase 1): web (lint, typecheck, build, playwright), api (pytest + migrations check),
  # dependency scanning, secret scanning, TA-Lib cross-validation job.
